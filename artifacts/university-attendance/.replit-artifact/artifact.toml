kind = "mobile"
previewPath = "/"
title = "University Attendance"
description = "A mobile attendance app for university students that scans an attendance QR code, captures a selfie for identity confirmation, validates the submission, and keeps a local attendance history."
version = "1.0.0"
id = "artifacts/university-attendance"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26270

[services.development]
run = "pnpm --filter @workspace/university-attendance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/university-attendance", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/university-attendance", "run", "serve" ]

[services.env]
PORT = "26270"
BASE_PATH = "/"
